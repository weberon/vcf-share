<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #downloadLinkContainer {
            margin-top: 20px;
        }
        img {
            max-width: 100%; /* Make image responsive */
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <img src="ReachPersona-LOGO.-V3psd.png" alt="Logo">
    <p>Click Send SMS to Share your Name</p>
    <p>Close SMS, then Download Contact vCard</p>
    <button onclick="launchSMSAndShowDownload()">Send SMS</button>
    <p id="downloadLinkContainer" style="display: none;">
        <a id="vcardDownloadLink" href="reachpersona.vcf" download="reachpersona_card.vcf">Download Contact vCard</a>
    </p>
    <script>
        function launchSMSAndShowDownload() {
            let fullName = "(Name): ";
            let encodedFullName = encodeURIComponent(fullName);
            window.location.href = 'sms:+19252332733?body=Hi,%20I%20am%20' + encodedFullName;
            setTimeout(function() {
                document.getElementById('downloadLinkContainer').style.display = 'block';
            }, 2000); // 2000 milliseconds (2 seconds) delay
        }
    </script>
</body>
</html>
